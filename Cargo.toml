[package]
name = "remoteid"
version = "0.3.1"
authors = ["Matt Busel <matt@busel.dev>"]
edition = "2021"
rust-version = "1.70"
description = "Most Remote ID receivers believe whatever the air tells them; this one does not. Drone Remote ID (ASTM F3411-22a, EN 4709-002) in no_std Rust: decode, track, DRIP RFC 9575 signature checks, a spoofed/suspicious/plausible/authenticated verdict for every transmitter, and a CI gate that fails receivers which accept spoofers (open receivers: 0 of 10 spoofers flagged; remoteid: 10 of 10)"
license = "MIT"
repository = "https://github.com/Mattbusel/remoteid"
homepage = "https://github.com/Mattbusel/remoteid"
documentation = "https://docs.rs/remoteid"
readme = "README.md"
keywords = ["remote-id", "drone", "spoofing", "drip", "counter-uas"]
categories = ["aerospace::drones", "aerospace::protocols", "no-std", "parser-implementations", "encoding"]
# The bundled spoof corpus and sample captures ship for remoteid-replay;
# the test sources, CI, Python package, fuzzers and generators do not.
include = [
    "/src/**",
    "/examples/**",
    "/docs/**",
    "/tests/data/spoof/*.pcap",
    "/tests/data/odid_*",
    "/tests/data/LICENSE-APACHE-opendroneid",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["std"]
## Enables the `Tracker` (per-aircraft state with expiry) and `std::error::Error` for `Error`.
std = []
## Derives `serde::Serialize` and `serde::Deserialize` on the decoded types.
serde = ["dep:serde"]
## DRIP (RFC 9374 / RFC 9575) signature checks with Ed25519 and cSHAKE128: the `auth` module.
verify = ["dep:ed25519-dalek", "dep:sha3"]
## Builds the `remoteid-replay` binary: `cargo install remoteid --features cli`.
cli = ["std"]

[[bin]]
name = "remoteid-replay"
path = "src/bin/remoteid-replay.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
ed25519-dalek = { version = "2.1", default-features = false, optional = true }
sha3 = { version = "0.10.8", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[package.metadata.docs.rs]
all-features = true
