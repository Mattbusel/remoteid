[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "remoteid"
version = "0.2.3"
description = "Drone Remote ID (ASTM F3411, EN 4709-002) decoding and trust verdicts: spoof and plausibility checks, DRIP (RFC 9575) signature verification, tar1090 aircraft.json"
readme = "DESCRIPTION.md"
license = { text = "MIT" }
authors = [{ name = "Matt Busel", email = "matt@busel.dev" }]
requires-python = ">=3.10"
keywords = ["remote-id", "drone", "uas", "opendroneid", "drip", "spoofing", "astm-f3411"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Mattbusel/remoteid"
Documentation = "https://github.com/Mattbusel/remoteid/blob/main/docs/python.md"
Source = "https://github.com/Mattbusel/remoteid"

[tool.maturin]
python-source = "python"
module-name = "remoteid._remoteid"
features = ["pyo3/extension-module"]
